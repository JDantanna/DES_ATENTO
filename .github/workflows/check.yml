name: Verificar

# Compila e roda os testes a cada envio para a main (a release só sai com tag v*).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    # Para publicar as capturas de tela no ramo ci-capturas.
    permissions:
      contents: write
    env:
      NAVI_CAPTURAS: ${{ github.workspace }}\capturas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testes
        shell: pwsh
        # Em caso de falha, repete os erros como anotações, legíveis sem baixar o log inteiro.
        run: |
          $ErrorActionPreference = 'Continue'
          $env:CARGO_TERM_COLOR = 'never'
          cargo test --release *>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath saida.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path saida.txt -Pattern '^error|^test .* FAILED|panicked at' -Context 0,5 | Select-Object -First 9 | ForEach-Object {
              $text = (@($_.Line) + $_.Context.PostContext) -join ' | '
              Write-Output "::error::$text"
            }
          }
          exit $code
      # Revisão automática do código: aponta o que melhorar, sem reprovar o envio.
      - name: Clippy
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:CARGO_TERM_COLOR = 'never'
          rustup component add clippy
          cargo clippy --all-targets *>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath clippy.txt
          Select-String -Path clippy.txt -Pattern '^warning' -Context 0,1 | Where-Object { $_.Line -notmatch 'generated \d+ warning' } | Select-Object -First 10 | ForEach-Object {
            Write-Output "::warning::$($_.Line) | $($_.Context.PostContext)"
          }
          exit 0
      # As telas desenhadas pelo teste viram um único commit no ramo ci-capturas (a main não muda).
      - name: Publicar capturas
        if: always() && hashFiles('capturas/*.png') != ''
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
        run: |
          Set-Location capturas
          git init -q -b ci-capturas
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Capturas de $env:GITHUB_SHA"
          git push -q --force "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-capturas
