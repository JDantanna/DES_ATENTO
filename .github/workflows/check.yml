name: Verificar

# Compila e roda os testes a cada envio para a main (a release só sai com tag v*).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    # Para publicar as capturas de tela no ramo ci-capturas.
    permissions:
      contents: write
    env:
      NAVI_CAPTURAS: ${{ github.workspace }}\capturas
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Testes
        shell: pwsh
        # Em caso de falha, repete os erros como anotações, legíveis sem baixar o log inteiro.
        run: |
          $ErrorActionPreference = 'Continue'
          $env:CARGO_TERM_COLOR = 'never'
          # O log inteiro fica na pasta das capturas, que vai para o ramo ci-capturas mesmo quando os testes caem.
          New-Item -ItemType Directory -Force $env:NAVI_CAPTURAS | Out-Null
          cargo test --release *>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath "$env:NAVI_CAPTURAS\saida.txt"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path "$env:NAVI_CAPTURAS\saida.txt" -Pattern '^error|^test .* FAILED|panicked at' -Context 0,5 | Select-Object -First 9 | ForEach-Object {
              $text = (@($_.Line) + $_.Context.PostContext) -join ' | '
              Write-Output "::error::$text"
            }
          }
          exit $code
      # Se os testes falharam (ou o programa de testes caiu, como num acesso inválido), roda cada teste sozinho
      # para dizer qual é o culpado: o resumo do cargo não traz o nome quando o processo morre.
      - name: Qual teste falha
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:CARGO_TERM_COLOR = 'never'
          $names = cargo test --release -- --list 2>$null | ForEach-Object { if ("$_" -match '^(.+): test$') { $Matches[1] } }
          foreach ($n in $names) {
            cargo test --release $n -- --exact *> $null
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::Teste que falha sozinho: $n (codigo $LASTEXITCODE)" }
          }
          exit 0
      # Revisão automática do código: aponta o que melhorar, sem reprovar o envio.
      - name: Clippy
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:CARGO_TERM_COLOR = 'never'
          rustup component add clippy
          cargo clippy --all-targets *>&1 | ForEach-Object { "$_" } | Tee-Object -FilePath clippy.txt
          Select-String -Path clippy.txt -Pattern '^warning' -Context 0,1 | Where-Object { $_.Line -notmatch 'generated \d+ warning' } | Select-Object -First 10 | ForEach-Object {
            Write-Output "::warning::$($_.Line) | $($_.Context.PostContext)"
          }
          exit 0
      # As telas desenhadas pelo teste viram um único commit no ramo ci-capturas (a main não muda).
      - name: Publicar capturas
        if: always()
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
        run: |
          Set-Location capturas
          git init -q -b ci-capturas
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "Capturas de $env:GITHUB_SHA"
          git push -q --force "https://x-access-token:$env:TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-capturas
